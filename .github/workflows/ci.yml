name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    name: Server tests (incl. flash-sale concurrency)
    runs-on: ubuntu-latest
    # A throwaway MongoDB for the tests, reached over IPv4 at 127.0.0.1:27017.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --workspace server
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017

  client-checks:
    name: Client lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace client
      - run: npm run build --workspace client
