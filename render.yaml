# Deploys the whole app as one Render web service: an always-on Node server
# that serves the built client and connects to MongoDB Atlas for storage.
services:
  - type: web
    name: engineers-point
    runtime: node
    plan: free
    # Vite is a dev dependency but is needed to build the client, so include dev deps.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DB_NAME
        value: engineers_point
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string, set in the Render dashboard
      - key: JWT_SECRET
        sync: false # long random string for signing login tokens
      - key: ADMIN_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false